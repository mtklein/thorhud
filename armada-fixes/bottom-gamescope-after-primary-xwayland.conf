# The bottom-screen gamescope must not take X display :0.
#
# Armada unlocks the bottom screen ("stays off until Steam is started and
# unlocked", 20261109) by setting GAMESCOPE_COMPANION_LOCKED on DISPLAY=:0,
# assuming :0 belongs to the main gamescope. This service starts the moment
# the main gamescope opens its DRM lease socket, which is just before the main
# gamescope starts its own Xwayland servers, so now and then this one wins the
# race for :0. The unlock then goes to the wrong gamescope and the bottom
# screen stays black for the whole session.
#
# So wait (up to 15 s) for :0 to exist before starting.
[Service]
ExecStartPre=/bin/sh -c "for i in $$(seq 150); do [ -S /tmp/.X11-unix/X0 ] && exit 0; sleep 0.1; done; exit 0"
